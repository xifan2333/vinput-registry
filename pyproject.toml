[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF001", # ambiguous unicode characters (Chinese punctuation in strings)
    "RUF002", # ambiguous unicode docstrings
    "RUF003", # ambiguous unicode comments
    "B008",   # function call in argument default
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyright]
include = ["resources", "scripts"]
exclude = [
    "**/__pycache__",
    ".ruff_cache",
    ".git",
]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
