id: batch-asr-contract
message: "Batch ASR entry.py 缺少核心契约函数或结构化异常定义。必须定义 VInputError, ConfigError, notify_error，并实现 load_config, read_audio_input, transcribe, emit_transcript, run, main。"
severity: error
language: Python
files:
  - "resources/providers/**/batch/entry.py"
  - "resources/providers/**/*batch*/entry.py"
rule:
  kind: module
  not:
    all:
      - has:
          kind: class_definition
          has: { field: name, regex: "^VInputError$" }
      - has:
          kind: class_definition
          has: { field: name, regex: "^ConfigError$" }
      - has:
          kind: function_definition
          has: { field: name, regex: "^notify_error$" }
      - has:
          kind: function_definition
          has: { field: name, regex: "^load_config$" }
      - has:
          kind: function_definition
          has: { field: name, regex: "^read_audio_input$" }
      - has:
          kind: function_definition
          has: { field: name, regex: "^transcribe$" }
      - has:
          kind: function_definition
          has: { field: name, regex: "^emit_transcript$" }
      - has:
          kind: function_definition
          has: { field: name, regex: "^run$" }
      - has:
          kind: function_definition
          has: { field: name, regex: "^main$" }
